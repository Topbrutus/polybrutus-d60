name: Verify Polybrutus D60 exact science and Zenodo bibliography
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d60:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact rational dependencies
        run: python -m pip install sympy==1.14.0
      - name: Primary exact Euclidean metric and ideal graph
        run: python src/verify_d60.py
      - name: Independent Fraction labelled squared distances
        run: python tests/independent_d60.py
      - name: Deterministic original JSON certificate unchanged
        run: git diff --exit-code -- results/certificate_d60.json
      - name: Validate D60 current structured parent DOI and bibliography
        run: python src/check_zenodo_metadata.py
